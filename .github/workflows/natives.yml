name: Build Natives

on:
  workflow_dispatch:
    inputs:
      verify-lock-closure:
        description: "Run resolver drift check (tools/natives/refresh-lock-closure.sh --check)"
        required: false
        type: boolean
        default: false

jobs:
  build-natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-x86_64
            os: ubuntu-24.04
          - classifier: linux-aarch64
            os: ubuntu-24.04-arm
          - classifier: osx-x86_64
            os: macos-15-intel
          - classifier: osx-aarch64
            os: macos-15
          - classifier: windows-x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install conda-package-handling
        shell: bash
        run: |
          python -m pip install --user conda-package-handling
          USER_BASE="$(python -m site --user-base)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$USER_BASE/Scripts" >> "$GITHUB_PATH"
          else
            echo "$USER_BASE/bin" >> "$GITHUB_PATH"
          fi

      - name: Make scripts executable
        shell: bash
        run: chmod +x ./gradlew tools/natives/*.sh

      - name: Validate lock file
        shell: bash
        run: tools/natives/verify-lock.sh

      - name: Validate lock closure
        if: ${{ inputs.verify-lock-closure }}
        shell: bash
        run: tools/natives/refresh-lock-closure.sh --check

      - name: Install patchelf (Linux only)
        if: startsWith(matrix.classifier, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Stage native payload
        shell: bash
        run: tools/natives/fetch-and-stage.sh ${{ matrix.classifier }}

      - name: Audit runtime dependencies
        shell: bash
        run: tools/natives/audit-runtime-deps.sh ${{ matrix.classifier }}

      - name: Assemble natives jars
        shell: bash
        run: ./gradlew :gdal-ffm-natives:assemble

      - name: Run packaged smoke (standard)
        shell: bash
        run: |
          set -euo pipefail
          matches=()
          while IFS= read -r path; do
            [[ -n "$path" ]] && matches+=("$path")
          done < <(
            find gdal-ffm-natives/build/libs -maxdepth 1 -type f \
              -name "gdal-ffm-natives-*-natives-${{ matrix.classifier }}.jar" \
              ! -name "gdal-ffm-natives-swiss-*" \
              ! -name "gdal-ffm-natives-cn-*" \
              | sort
          )
          if [[ ${#matches[@]} -ne 1 ]]; then
            echo "Expected exactly one standard native jar for classifier ${{ matrix.classifier }}, found ${#matches[@]}" >&2
            printf '%s\n' "${matches[@]}" >&2 || true
            exit 1
          fi
          jar_path="$(pwd)/${matches[0]}"
          shared_tmpdir="$(pwd)/gdal-ffm-core/build/tmp/smoke/${{ matrix.classifier }}-standard-shared"
          for run_label in first second; do
            ./gradlew :gdal-ffm-core:smokeTestPackagedNative \
              -PgdalFfmSmokeNativeJar="$jar_path" \
              -PgdalFfmSmokeLabel="${{ matrix.classifier }}-standard-${run_label}" \
              -PgdalFfmSmokeTmpDir="$shared_tmpdir"
          done

      - name: Run packaged smoke (swiss)
        shell: bash
        run: |
          set -euo pipefail
          matches=()
          while IFS= read -r path; do
            [[ -n "$path" ]] && matches+=("$path")
          done < <(
            find gdal-ffm-natives/build/libs -maxdepth 1 -type f \
              -name "gdal-ffm-natives-swiss-*-natives-${{ matrix.classifier }}.jar" \
              | sort
          )
          if [[ ${#matches[@]} -ne 1 ]]; then
            echo "Expected exactly one swiss native jar for classifier ${{ matrix.classifier }}, found ${#matches[@]}" >&2
            printf '%s\n' "${matches[@]}" >&2 || true
            exit 1
          fi
          jar_path="$(pwd)/${matches[0]}"
          shared_tmpdir="$(pwd)/gdal-ffm-core/build/tmp/smoke/${{ matrix.classifier }}-swiss-shared"
          for run_label in first second; do
            ./gradlew :gdal-ffm-core:smokeTestPackagedNative \
              -PgdalFfmSmokeNativeJar="$jar_path" \
              -PgdalFfmSmokeLabel="${{ matrix.classifier }}-swiss-${run_label}" \
              -PgdalFfmSmokeTmpDir="$shared_tmpdir"
          done

      - name: Run packaged smoke (cn)
        shell: bash
        run: |
          set -euo pipefail
          matches=()
          while IFS= read -r path; do
            [[ -n "$path" ]] && matches+=("$path")
          done < <(
            find gdal-ffm-natives/build/libs -maxdepth 1 -type f \
              -name "gdal-ffm-natives-cn-*-natives-${{ matrix.classifier }}.jar" \
              | sort
          )
          if [[ ${#matches[@]} -ne 1 ]]; then
            echo "Expected exactly one cn native jar for classifier ${{ matrix.classifier }}, found ${#matches[@]}" >&2
            printf '%s\n' "${matches[@]}" >&2 || true
            exit 1
          fi
          jar_path="$(pwd)/${matches[0]}"
          shared_tmpdir="$(pwd)/gdal-ffm-core/build/tmp/smoke/${{ matrix.classifier }}-cn-shared"
          for run_label in first second; do
            ./gradlew :gdal-ffm-core:smokeTestPackagedNative \
              -PgdalFfmSmokeNativeJar="$jar_path" \
              -PgdalFfmSmokeLabel="${{ matrix.classifier }}-cn-${run_label}" \
              -PgdalFfmSmokeTmpDir="$shared_tmpdir"
          done

      - name: Dump Windows smoke diagnostics on failure
        if: failure() && matrix.classifier == 'windows-x86_64'
        shell: bash
        run: |
          set +e
          echo "=== Windows packaged smoke diagnostics ==="
          dump_tool=""
          if command -v dumpbin >/dev/null 2>&1; then
            dump_tool="dumpbin"
          elif command -v llvm-objdump >/dev/null 2>&1; then
            dump_tool="llvm-objdump"
          fi

          inspect_native_jar() {
            local prefix="$1"
            local tmpdir="$2"
            local jar_path
            jar_path="$(find gdal-ffm-natives/build/libs -maxdepth 1 -type f -name "${prefix}-*-natives-${{ matrix.classifier }}.jar" | sort | head -n1)"
            if [[ -z "$jar_path" ]]; then
              echo "No ${prefix} jar found for diagnostics"
              return
            fi

            echo "--- jar tf ${jar_path}"
            jar tf "$jar_path" || true

            echo "--- extracted tree under ${tmpdir}"
            find "$tmpdir" -maxdepth 6 -print 2>/dev/null || true

            while IFS= read -r dll_path; do
              [[ -n "$dll_path" ]] || continue
              echo "--- dependency dump for ${dll_path}"
              if [[ "$dump_tool" == "dumpbin" ]]; then
                dumpbin /DEPENDENTS "$dll_path" || true
              elif [[ "$dump_tool" == "llvm-objdump" ]]; then
                llvm-objdump -p "$dll_path" || true
              else
                echo "No dump tool available"
              fi
            done < <(
              find "$tmpdir" \
                \( -path '*/windows-x86_64/bin/proj_9.dll' -o -path '*/windows-x86_64/bin/gdal.dll' \) \
                -type f 2>/dev/null | sort -u
            )
          }

          inspect_native_jar "gdal-ffm-natives" "$(pwd)/gdal-ffm-core/build/tmp/smoke/${{ matrix.classifier }}-standard-shared"
          inspect_native_jar "gdal-ffm-natives-swiss" "$(pwd)/gdal-ffm-core/build/tmp/smoke/${{ matrix.classifier }}-swiss-shared"
          inspect_native_jar "gdal-ffm-natives-cn" "$(pwd)/gdal-ffm-core/build/tmp/smoke/${{ matrix.classifier }}-cn-shared"

      - name: Upload classifier artifact (standard)
        uses: actions/upload-artifact@v4
        with:
          name: gdal-ffm-natives-${{ matrix.classifier }}
          path: gdal-ffm-natives/build/libs/gdal-ffm-natives-*-natives-${{ matrix.classifier }}.jar

      - name: Upload classifier artifact (swiss)
        uses: actions/upload-artifact@v4
        with:
          name: gdal-ffm-natives-swiss-${{ matrix.classifier }}
          path: gdal-ffm-natives/build/libs/gdal-ffm-natives-swiss-*-natives-${{ matrix.classifier }}.jar

      - name: Upload classifier artifact (cn)
        uses: actions/upload-artifact@v4
        with:
          name: gdal-ffm-natives-cn-${{ matrix.classifier }}
          path: gdal-ffm-natives/build/libs/gdal-ffm-natives-cn-*-natives-${{ matrix.classifier }}.jar
